<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокси для Марты</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        .proxy-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .proxy-link {
            display: block;
            background-color: var(--card-bg);
            color: var(--accent);
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .proxy-link:active {
            transform: scale(0.98);
            background-color: #24344d;
            color: var(--accent-hover);
        }

        .dog-button {
            font-size: 5rem;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.1s ease;
            margin-top: auto;
            padding: 10px;
        }

        @keyframes barkAnimation {
            0% { transform: scale(1); }
            20% { transform: scale(1.3) rotate(-15deg); }
            40% { transform: scale(1.3) rotate(15deg); }
            60% { transform: scale(1.3) rotate(-10deg); }
            80% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1); }
        }

        .barking {
            animation: barkAnimation 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Здравствуй, Марта!</h1>
        <p class="subtitle">Подключай новые прокси:</p>

        <!-- Сюда скрипт сам добавит красивые кнопки -->
        <div class="proxy-list" id="proxyContainer"></div>
    </div>

    <div class="dog-button" id="dogBtn" role="button" aria-label="Лаять">🐕‍🦺</div>

    <script>
        // ==========================================
        // ВСТАВЛЯЙТЕ ВАШИ ССЫЛКИ СЮДА (ЧЕРЕЗ ЗАПЯТУЮ)
        // ==========================================
        const proxyRawList = [
"tg://proxy?server=s03.neo-trading.org&port=443&secret=eeaf794bcc20f70b1436b6b92b01b207e26d61676e69742e7275",
"tg://proxy?server=s02.neo-trading.org&port=443&secret=ee6ec9f7e082baf2397b450727ce78447e6f7a6f6e2e7275",
"tg://proxy?server=s6.postpulse.space&port=443&secret=ee179deb3806ddd388988092081a52ad766164332e617269786f2e73686f70",
"tg://proxy?server=tg.deepwoof.net&port=443&secret=ee6164732e78352e727530ac46ef4d53",
"tg://proxy?server=ad1.arixo.shop&port=443&secret=eee09f46368021f91b92ad3dea14c7ac896164312e617269786f2e73686f70"
        ];
        // ==========================================

// Генерация кнопок из текстового списка
        const container = document.getElementById('proxyContainer');
        proxyRawList.forEach((url, index) => {
            const cleanUrl = url.trim();
            
            let serverName = `Прокси ${index + 1}`;
            try {
                // Корректируем опечатку в третьей ссылке (proxy= на proxy?server=), если она есть
                const fixedUrl = cleanUrl.replace('proxy=', 'proxy?server=');
                const urlObj = new URL(fixedUrl.replace('tg://', 'http://'));
                const serverParam = urlObj.searchParams.get('server');
                if (serverParam) {
                    serverName = serverParam;
                }
            } catch (e) {
                // Оставляем дефолтное имя в случае ошибки
            }

            const a = document.createElement('a');
            a.className = 'proxy-link';
            a.href = cleanUrl;
            a.textContent = serverName;
            
            // ФИКС: Открываем в новой вкладке, чтобы текущая страница не терялась
            a.target = '_blank';
            a.rel = 'noopener noreferrer'; 
            
            container.appendChild(a);
        });

        // Функция программного звука лая
        function playBarkSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            createBarkWave(ctx, 0);
            createBarkWave(ctx, 0.08);
        }

        function createBarkWave(ctx, startTime) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(280, ctx.currentTime + startTime);
            osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + startTime + 0.15);
            
            gain.gain.setValueAtTime(0.4, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + startTime + 0.18);
            
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, ctx.currentTime + startTime);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + 0.2);
        }

        const dogBtn = document.getElementById('dogBtn');
        dogBtn.addEventListener('click', () => {
            playBarkSound();
            dogBtn.classList.remove('barking');
            void dogBtn.offsetWidth; 
            dogBtn.classList.add('barking');
        });

        dogBtn.addEventListener('animationend', () => {
            dogBtn.classList.remove('barking');
        });
    </script>
</body>
</html>
